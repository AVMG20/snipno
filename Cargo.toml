[package]
name = "snipno"
version = "0.1.0"
edition = "2024"
description = "Menu bar screenshot tool for macOS: draw, smart-select, copy."
license = "MIT"
repository = "https://github.com/AVMG20/snipno"

[dependencies]
arboard = "3.7"
dirs = "7"
eframe = "0.37"
global-hotkey = "0.10"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tiny-skia = "0.12"
tray-icon = "0.26"
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
winit = { version = "0.30", default-features = false }
